name: Daily catalog refresh

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Refresh and verify catalog
        run: |
          python scripts/scrape_programs.py
          python scripts/validate_data.py
          python scripts/generate_dashboard.py
          python -m pytest -q

      - name: Commit refresh branch
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/daily-catalog-refresh
          git add data/active/programs.json data/archived/programs.json README.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): refresh student program catalog"
          git push --force-with-lease origin HEAD:automation/daily-catalog-refresh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh pr view automation/daily-catalog-refresh --json url >/dev/null 2>&1; then
            gh pr edit automation/daily-catalog-refresh \
              --title "chore(data): refresh student program catalog" \
              --body "Automated catalog refresh. Validation and tests passed in the refresh workflow."
          else
            gh pr create \
              --base main \
              --head automation/daily-catalog-refresh \
              --title "chore(data): refresh student program catalog" \
              --body "Automated catalog refresh. Validation and tests passed in the refresh workflow."
          fi
