name: Catalog health check

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate catalog and configuration
        run: |
          python -m json.tool config/allowlist.json >/dev/null
          python -m json.tool data/schema.json >/dev/null
          python scripts/validate_data.py

      - name: Check catalog invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          programs = json.loads(Path("data/active/programs.json").read_text(encoding="utf-8"))
          ids = [program["id"] for program in programs]
          if not programs:
              raise SystemExit("Catalog contains no active programs")
          if len(ids) != len(set(ids)):
              raise SystemExit("Catalog contains duplicate program IDs")
          print(f"Catalog health check passed for {len(programs)} active programs")
          PY
