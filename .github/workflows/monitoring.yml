name: Catalog health check

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate catalog and configuration
        run: |
          python -m json.tool config/allowlist.json >/dev/null
          python -m json.tool data/schema.json >/dev/null
          python scripts/validate_data.py

      - name: Check catalog invariants
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path

          MAX_STALE_DAYS = 60
          programs = json.loads(Path("data/active/programs.json").read_text(encoding="utf-8"))
          allowlist = json.loads(Path("config/allowlist.json").read_text(encoding="utf-8"))
          allowlisted_companies = {company["name"] for company in allowlist["companies"]}
          ids = [program["id"] for program in programs]
          if not programs:
              raise SystemExit("Catalog contains no active programs")
          if len(ids) != len(set(ids)):
              raise SystemExit("Catalog contains duplicate program IDs")
          unexpected_companies = sorted(
              {program["company"] for program in programs} - allowlisted_companies
          )
          if unexpected_companies:
              raise SystemExit(
                  f"Active catalog contains non-allowlisted companies: {unexpected_companies}"
              )

          today = date.today()
          stale = []
          for program in programs:
              verified = program.get("last_verified")
              if not verified:
                  stale.append((program.get("name", "unknown"), "missing last_verified"))
                  continue
              days = (today - datetime.strptime(verified, "%Y-%m-%d").date()).days
              if days > MAX_STALE_DAYS:
                  stale.append((program.get("name", "unknown"), f"{days} days stale"))

          if stale:
              print(f"WARNING: {len(stale)} programs exceed {MAX_STALE_DAYS}-day freshness SLO:")
              for name, reason in stale[:10]:
                  print(f"  - {name}: {reason}")
              if len(stale) > 10:
                  print(f"  ... and {len(stale) - 10} more")
          else:
              print("All programs within freshness SLO")

          print(f"Catalog health check passed for {len(programs)} active programs")
          PY
